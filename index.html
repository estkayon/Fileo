<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Free file converter and PDF editor that works in your browser. Files are never uploaded."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Fileo</title>
    <script>
      // Apply the saved theme before the page paints, so dark mode does not flash white.
      try {
        if (localStorage.getItem('fileo-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch {
        // Storage can be blocked. The light theme is used then.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
